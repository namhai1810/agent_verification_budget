[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downstream-aware-verification"
version = "0.1.0"
description = "Reproducible Phase-1 experiments for downstream-aware verification in fixed agent workflows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "datasets==4.2.0",
  "httpx==0.28.1",
  "matplotlib==3.10.7",
  "numpy==2.2.6",
  "pydantic==2.12.3",
  "PyYAML==6.0.3",
  "scikit-learn==1.7.2",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.2",
]
darc = [
  "torch>=2.3,<3",
  # v5 removed tokenizer APIs used by the audited chunking path. Keep the
  # semantic encoder on the stable v4 API until a separate migration audit.
  "transformers>=4.45,<5",
  "safetensors>=0.4,<1",
]

[project.scripts]
agent-verify = "agent_verify.cli:main"
cbv-bench = "agent_verify.cbv_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/agent_verify/analysis/analyze_h1.py" = ["E501"]
"scripts/analyze_h1_offline.py" = ["E501"]
"src/agent_verify/analysis/phase2.py" = ["E501"]
"src/agent_verify/analysis/phase2_data.py" = ["E501"]
"src/agent_verify/analysis/phase2_models.py" = ["E501"]
"src/agent_verify/analysis/phase3_training.py" = ["E501"]
"src/agent_verify/analysis/darc_data.py" = ["E501"]
"src/agent_verify/analysis/darc_model.py" = ["E501"]
"src/agent_verify/analysis/darc_experiment.py" = ["E501"]
"src/agent_verify/analysis/darc_v02_experiment.py" = ["E501"]
"src/agent_verify/analysis/darc_v02_test_evaluation.py" = ["E501"]
"scripts/audit_darc_v01.py" = ["E501"]
